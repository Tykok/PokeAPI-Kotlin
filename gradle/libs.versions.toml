[versions]
kotlin = "2.4.10"
ktlint = "14.2.0"
dokka = "2.2.0"
mavenPublish = "0.37.0"
okhttp = "5.5.0"
coroutines = "1.11.0"
# 0.18.2 on Maven Central - no marker on the Gradle Plugin Portal, so settings.gradle.kts maps
# this plugin id to its Maven Central module coordinates.
binaryCompatibility = "0.18.2"

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
binaryCompatibility = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibility" }

[libraries]
junitBom = { module = "org.junit:junit-bom", version = "6.1.3" }
junitJupiter = { module = "org.junit.jupiter:junit-jupiter" }
junitPlatform = { module = "org.junit.platform:junit-platform-launcher" }
mockk = { module = "io.mockk:mockk", version = "1.14.11" }
# https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-databind
jackson = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version = "2.22.2"}
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3-junit5", version.ref = "okhttp" }
coroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[bundles]
