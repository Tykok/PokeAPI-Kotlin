name: CI

# Single source of truth for "is this revision releasable?".
# Runs on every pull request and is reused (workflow_call) by the release
# pipeline so that main is never published without passing the same gates.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a run that the release pipeline is waiting on.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: temurin

jobs:
  lint:
    name: Ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run ktlint
        run: ./gradlew --no-daemon ktlintCheck

      - name: Upload ktlint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ktlint-reports
          path: build/reports/ktlint/
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # 3.0.0 shipped with 50 documentation snippets that no longer compiled - PokeApi.get became
      # suspend and nothing checked the docs against the code, so the break only surfaced after
      # release and had to be fixed by hand. extractDocSamples (build.gradle.kts) pulls every
      # ```kotlin block out of README.md and docs/mkdocs-markdown at build time - never a
      # hand-maintained copy - and compileTestKotlin compiles the result, so a sample that drifts
      # from the API fails here, on its own named step, instead of reaching the published site.
      - name: Compile the documentation samples
        run: ./gradlew --no-daemon compileTestKotlin

      - name: Run tests
        run: ./gradlew --no-daemon test jacocoTestReport

      - name: Upload test & coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build publishable artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Fails the pull request when an entity data class or a @PublishedApi-internal member's
      # signature changed without a matching `./gradlew apiDump`, so that slice of a breaking
      # change shows up in the diff. It does NOT cover the library's actual public entry surface:
      # binary-compatibility-validator omits reified-inline functions from the dump entirely, so
      # PokeApi.get/list/getBlocking/listBlocking, PokeApiCache.clear<T>() and the four
      # NamedApiResource(s) extensions can all change shape and this step still passes (see ruling
      # R58). ApiSignatureTest pins those instead, failing to COMPILE the moment one moves.
      - name: Check the public API surface
        run: ./gradlew --no-daemon apiCheck

      # Builds exactly the three files Maven Central requires (binary, sources,
      # javadoc) so a missing/failing one is caught on the PR, not at publish time.
      - name: Assemble jar, sources and javadoc
        run: ./gradlew --no-daemon assemble sourcesJar dokkaJavadocJar

      # Consumed by the release pipeline to attach the exact reviewed binaries
      # to the GitHub release instead of rebuilding them.
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libs
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      # --strict turns broken nav entries and dead internal links into failures,
      # so the published site can never regress silently.
      - name: Build documentation
        run: mkdocs build --strict --config-file docs/mkdocs.yml
