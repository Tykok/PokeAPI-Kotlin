name: Deploy documentation 📚

# Docs are decoupled from releases: a typo fix on main ships immediately
# instead of waiting for the next version bump.
on:
  push:
    branches:
      - "main"
    paths:
      - "docs/**"
      - ".github/workflows/deploy_docs.yml"
      # The site prints the version read from gradle.properties, so a release
      # bump has to redeploy the docs or the chip goes stale.
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # mkdocs gh-deploy pushes the built site to the gh-pages branch.
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gh-deploy needs the full history to update the gh-pages branch.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy site
        run: mkdocs gh-deploy --force --strict --config-file docs/mkdocs.yml

      - name: Summary
        run: echo "### Documentation deployed to https://tykok.github.io/PokeAPI-Kotlin/ 📚" >> "$GITHUB_STEP_SUMMARY"
