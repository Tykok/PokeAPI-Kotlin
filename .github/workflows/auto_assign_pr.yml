name: 'Auto Assign PR to Author'
on:
  pull_request:
    types: [ opened ]

permissions:
  contents: read

jobs:
  add-reviews:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: kentaro-m/auto-assign-action@0a2c53d3721e4c5cfcce6afd4014aecc337979f6 # v2.0.2
